[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "darkdola"
version = "0.1.0"
description = "Darkdola: Model Context Protocol AI Agent runtime, implements think-act-observe agent loop, connects Doubao LLM, supports MCP tool servers and SSE stream output."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "walnut" }
]
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.10,<3.0",
  "anyio>=4.0,<5.0",
  "httpx>=0.27,<0.29",
  "sse-starlette>=2.0,<3.0",
  "python-dotenv>=1.0,<2.0",
  "mcp>=1.0,<2.0",
  "identity-agnostic-worker>=0.1.2,<0.2.0",
  "brewer-nash-dispatcher>=0.0.0"
]

[project.urls]
Homepage = "https://github.com/walnut/darkdola"

[project.scripts]
darkdola = "darkdola:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<9.0",
  "black>=24.0",
  "ruff>=0.7"
]
browser = [
  "playwright>=1.48,<1.50"
]

[tool.setuptools]
py-modules = [
  "darkdola",
  "main",
  "mcp_client",
  "parse_tool_call",
  "reasoning_acting",
  "sender",
  "sse_hook",
  "tool_contract",
  "worker",
]
packages = ["doubao", "data"]

[tool.setuptools.package-data]
data = ["*.js", "*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
fix = true

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]